name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest
      # Run against the installed package (not the source tree) to check
      # that the database is packaged.
      - run: cd tests && python -m pytest -p no:cacheprovider -o addopts="" .
